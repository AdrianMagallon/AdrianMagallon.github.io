<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Catalog</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <p class="eyebrow">— Inventory —</p>
    <h1 id="page-title">Project Catalog</h1>
    <p id="page-tagline">A running inventory of things I've built.</p>
  </header>

  <main class="catalog" id="catalog-grid">
    <p class="state-msg">Loading…</p>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/github-api.js"></script>
  <script src="js/catalog.js"></script>
  <script>
    document.getElementById("page-title").textContent = CONFIG.siteTitle;
    document.getElementById("page-tagline").textContent = CONFIG.siteTagline;
    document.title = CONFIG.siteTitle;
    const footerLinks = [];
    if (CONFIG.links.github) footerLinks.push(`<a href="${CONFIG.links.github}">GitHub</a>`);
    if (CONFIG.links.linkedin) footerLinks.push(`<a href="${CONFIG.links.linkedin}">LinkedIn</a>`);
    if (CONFIG.links.email) footerLinks.push(`<a href="mailto:${CONFIG.links.email}">Email</a>`);
    document.getElementById("site-footer").innerHTML =
      `<span>© ${new Date().getFullYear()} ${CONFIG.ownerName}</span>` + footerLinks.join("");
  </script>
</body>
</html>
