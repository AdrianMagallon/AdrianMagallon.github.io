<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Spec Sheet</title>
  <meta name="description" content="Project spec sheet — details, stack, and files for this project, pulled live from GitHub." />
  <meta property="og:title" content="Project Spec Sheet" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%230e1a2b'/%3E%3Ctext x='50' y='65' font-size='38' font-family='monospace' font-weight='bold' fill='%23e8a33d' text-anchor='middle'%3EAM%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="index.html">← Back to portfolio</a>
  </header>

  <main class="spec-sheet" id="sheet-root">
    <p class="state-msg">Loading…</p>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/github-api.js"></script>
  <script src="js/detail.js"></script>
  <script>
    const footerLinks = [];
    if (CONFIG.links.github) footerLinks.push(`<a href="${CONFIG.links.github}">GitHub</a>`);
    if (CONFIG.links.linkedin) footerLinks.push(`<a href="${CONFIG.links.linkedin}">LinkedIn</a>`);
    if (CONFIG.links.email) footerLinks.push(`<a href="mailto:${CONFIG.links.email}">Email</a>`);
    document.getElementById("site-footer").innerHTML =
      `<span>© ${new Date().getFullYear()} ${CONFIG.ownerName}</span>` + footerLinks.join("");
  </script>
</body>
</html>
